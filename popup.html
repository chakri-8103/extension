<!DOCTYPE html>
<html>

<head>
    <title>Abhyas Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Abhyas Panel</h2>

        <div id="notLogin">
            <p>Please login to Abhyas</p>
            <button id="openSite">Open Website</button>
        </div>

        <div id="profile">

            <img id="photo">

            <h3 id="name"></h3>

            <p><b>SUC:</b> <span id="suc"></span></p>
            <p><b>Section:</b> <span id="section"></span></p>
            <p><b>Campus:</b> <span id="campus"></span></p>

            <button id="letstalk">Open Abhyas Vani</button>
            <button id="analysis">Open Analysis</button>
            <button id="lab">Open Lab</button>
            <button id="abhyas">Open Abhyas</button>


        </div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
