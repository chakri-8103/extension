<!DOCTYPE html>
<html>
<head>
    <title>Abhyas Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Abhyas Panel</h2>

    <div id="notLogin" class="hidden">
        <p>Please login to Abhyas</p>
        <button id="openSite">Open Website</button>
    </div>

    <div id="profile" class="hidden">

        <img id="photo">

        <h3 id="name"></h3>

        <p><b>SUC:</b> <span id="suc"></span></p>
        <p><b>Section:</b> <span id="section"></span></p>
        <p><b>Campus:</b> <span id="campus"></span></p>

        <button id="dashboard">Open Dashboard</button>

    </div>

</div>

<script src="popup.js"></script>

</body>
</html>
